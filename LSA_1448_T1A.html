<style>
/* ════════════ TOP HERO ════════════ */
.top-hero{
  background:linear-gradient(135deg,#2D6A6F 0%,#3F8388 50%,#5C9EAD 100%);
  padding:36px 32px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 32px rgba(45,106,111,.20);
  border-radius:0 0 32px 32px;
}
.top-hero::before{content:'';position:absolute;top:-50%;left:-20%;width:140%;height:200%;background:radial-gradient(ellipse,rgba(255,255,255,.15) 0%,transparent 50%);pointer-events:none;animation:float 18s ease-in-out infinite}
.top-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#D4A574,#E8C9A0,#D4A574)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

.top-hero-grid{display:grid;grid-template-columns:auto 1fr auto;gap:40px;align-items:center;max-width:1500px;margin:0 auto;position:relative;z-index:1}
.top-logo{height:88px;width:auto;background:#fff;padding:8px 12px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.top-hero-text{text-align:center}
.th-institute{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#fff;margin-bottom:6px;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.th-en{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.75);letter-spacing:5px;text-transform:uppercase;margin-bottom:18px}
.th-title{font-family:'Playfair Display',serif;font-size:34px;font-weight:900;color:#fff;margin-bottom:8px;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.th-sub{font-size:14px;color:#E8C9A0;font-weight:600;margin-bottom:18px}
.th-meta{display:inline-flex;gap:18px;font-size:13px;color:rgba(255,255,255,.95);background:rgba(255,255,255,.18);padding:10px 24px;border-radius:30px;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px)}
.th-meta span{display:flex;align-items:center;gap:6px}

@media(max-width:1100px){
  .top-hero{padding:24px 20px}
  .top-hero-grid{grid-template-columns:1fr;gap:20px}
  .top-logo{height:60px;justify-self:center}
  .top-hero-grid > .top-logo:last-child{display:none}
  .th-title{font-size:24px}
  .th-institute{font-size:20px}
  .th-meta{flex-wrap:wrap;gap:8px;font-size:11px;padding:8px 16px}
}

/* ════════════ REFINED PAGE HEADERS ════════════ */
.page-header{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px 32px;
  margin-bottom:24px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:24px;
  align-items:center;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  border-right:5px solid var(--ph-color,#2D6A6F);
}
.page-header::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--ph-color,#2D6A6F),transparent)}
.ph-icon-box{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--ph-color,#2D6A6F) 0%,var(--ph-color,#2D6A6F)CC 100%);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 20px var(--ph-color,#2D6A6F)40}
.ph-text{display:flex;flex-direction:column;gap:6px}
.page-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;color:var(--text);line-height:1.1;letter-spacing:-.5px}
.page-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;letter-spacing:2.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.page-sub::before{content:'';width:24px;height:1px;background:var(--ph-color,#2D6A6F);display:inline-block}
.ph-badge{padding:8px 16px;background:var(--ph-color,#2D6A6F)15;border:1px solid var(--ph-color,#2D6A6F)40;border-radius:24px;font-size:12px;color:var(--ph-color,#2D6A6F);font-family:'DM Mono',monospace;letter-spacing:1px;font-weight:600}
@media(max-width:900px){
  .page-header{grid-template-columns:auto 1fr;padding:18px 20px}
  .ph-badge{grid-column:1/-1;justify-self:start}
  .page-title{font-size:22px}
}

/* ════════════ ENHANCED KPI HERO ════════════ */
.kpi-hero{
  background:linear-gradient(135deg,#2D6A6F 0%,#3F8388 50%,#5C9EAD 100%);
  border:none;
  border-radius:24px;padding:40px;margin-bottom:24px;position:relative;overflow:hidden;
  box-shadow:0 16px 48px rgba(45,106,111,.22);
}
.kpi-hero::before{content:'';position:absolute;top:-30%;left:-10%;width:60%;height:160%;background:radial-gradient(ellipse,rgba(255,255,255,.18) 0%,transparent 60%);pointer-events:none}
.kpi-hero::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#D4A574,#E8C9A0,#D4A574)}
.kpi-hero-grid{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;position:relative;z-index:1}
.kpi-num{font-family:'Playfair Display',serif;font-size:120px;font-weight:900;line-height:.9;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.2);letter-spacing:-4px}
.kpi-side{display:flex;flex-direction:column;gap:6px;text-align:right;color:#fff}
.kpi-label{font-size:11px;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:3px;font-family:'DM Mono',monospace;margin-bottom:4px}
.kpi-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:4px}
.kpi-avg{font-size:22px;color:#E8C9A0;font-family:'DM Mono',monospace;font-weight:500;letter-spacing:1px}
.kpi-verdict{margin-top:14px;padding:10px 18px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:14px;font-size:13px;color:#fff;font-weight:600;display:inline-block;width:fit-content;backdrop-filter:blur(8px)}
@media(max-width:900px){.kpi-hero{padding:24px}.kpi-num{font-size:72px}.kpi-name{font-size:20px}}

:root{
  /* ━━━ Quality Calm Palette ━━━ */
  /* Backgrounds (warm neutrals) */
  --bg:#FAFAF7; --bg2:#F5F0E8; --surf:#FFFFFF; --surf2:#F5F0E8; --surf3:#EDE7DD;
  /* Borders & dividers */
  --border:rgba(45,74,92,.10); --border2:rgba(45,74,92,.05);
  /* Text hierarchy */
  --text:#2D3E50; --text2:#5C6C7C; --text3:#8B9698;
  /* Primary palette (Analogous) */
  --teal-deep:#2D6A6F; --teal:#5C9EAD; --teal-light:#8BB8B8;
  --sage:#7BA88A; --sage-light:#A4C2A8;
  /* Accents (Triadic + Complement) */
  --gold:#D4A574; --gold-light:#E8C9A0;
  --coral:#E8826E; --coral-light:#F4B5A0;
  --plum:#8B6F8F; --plum-light:#B999BC;
  /* Semantic aliases */
  --primary:#2D6A6F; --secondary:#7BA88A;
  --good:#7BA88A; --warn:#D4A574; --bad:#E8826E;
  /* Shadows (soft, warm) */
  --shadow:0 4px 20px rgba(45,62,80,.06); --shadow-lg:0 12px 32px rgba(45,62,80,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
body{background:
  radial-gradient(ellipse 1400px 900px at 15% 0%,rgba(45,106,111,.06) 0%,transparent 55%),
  radial-gradient(ellipse 1000px 700px at 85% 100%,rgba(123,168,138,.05) 0%,transparent 55%),
  radial-gradient(ellipse 800px 600px at 50% 50%,rgba(212,165,116,.03) 0%,transparent 60%),
  var(--bg)}

/* Layout */
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.sidebar{background:#fff;border-left:1px solid var(--border);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:4px 0 24px rgba(15,23,42,.04)}
.main{padding:24px 32px;overflow-x:hidden}

/* Sidebar */
.brand{display:flex;align-items:center;gap:10px;padding:14px;margin-bottom:18px;border-radius:14px;background:linear-gradient(135deg,#F0E8DC 0%,#E5D9C5 100%);border:1px solid #D4C7B0}
.brand-logo{width:42px;height:42px;object-fit:contain}
.brand-text{flex:1}
.brand-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:#2D6A6F;line-height:1.2}
.brand-sub{font-size:9px;color:#7BA88A;text-transform:uppercase;letter-spacing:1.5px;font-family:'DM Mono',monospace;margin-top:2px;font-weight:600}

.nav-section{margin-top:20px}
.nav-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;font-family:'DM Mono',monospace;padding:0 12px;margin-bottom:8px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;color:var(--text2);cursor:pointer;transition:all .25s;font-size:13px;font-weight:500;margin-bottom:4px;border:1px solid transparent}
.nav-item:hover{background:#F5F0E8;color:#2D6A6F}
.nav-item.active{background:linear-gradient(135deg,#2D6A6F 0%,#3F8388 100%);color:#fff;box-shadow:0 4px 14px rgba(45,106,111,.28);border-color:rgba(255,255,255,.2)}
.nav-icon{font-size:18px;width:24px;text-align:center}
.nav-badge{margin-right:auto;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;font-family:'DM Mono',monospace;font-weight:600}
.nav-item:not(.active) .nav-badge{background:#F5F0E8;color:#2D6A6F}

/* Sections */
.section{background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid #F1F5F9;flex-wrap:wrap;gap:10px}
.section-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px}
.section-sub{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;letter-spacing:1.5px;font-weight:600}

/* KPIs row */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;position:relative;overflow:hidden;transition:all .3s;box-shadow:var(--shadow)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--kpi-color,var(--primary)),var(--kpi-color,var(--primary)))}
.kpi:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(15,23,42,.10);border-color:var(--kpi-color)}
.kpi-n{font-family:'Playfair Display',serif;font-size:38px;font-weight:900;line-height:1;margin-bottom:6px}
.kpi-l{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;font-family:'DM Mono',monospace;font-weight:600}

/* Grids */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.two-col-uneven{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:1100px){.two-col,.two-col-uneven{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}}

.chart-wrap{position:relative;height:360px}
.chart-wrap.small{height:260px}
.chart-wrap.large{height:480px}

/* Diploma cards */
.dip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.dip-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;overflow:hidden;cursor:pointer;transition:all .3s;box-shadow:var(--shadow)}
.dip-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--dc),var(--dc)CC)}
.dip-card:hover{transform:translateY(-6px);border-color:var(--dc);box-shadow:0 16px 40px rgba(15,23,42,.12)}
.dip-icon{font-size:40px;margin-bottom:12px}
.dip-name{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:16px;color:var(--text);min-height:40px}
.dip-pct{font-family:'Playfair Display',serif;font-size:52px;font-weight:900;color:var(--dc);line-height:1;margin-bottom:6px;letter-spacing:-2px}
.dip-avg{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);margin-bottom:14px;font-weight:500}
.dip-stats{display:flex;justify-content:space-between;padding-top:14px;border-top:2px solid #F1F5F9;font-size:11px;color:var(--text2);font-family:'DM Mono',monospace;font-weight:600}
.dip-stats span{display:flex;align-items:center;gap:4px}

/* Heatmap */
.heatmap{width:100%;border-collapse:separate;border-spacing:3px;background:transparent}
.heatmap th{padding:10px 8px;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-family:'DM Mono',monospace;text-align:center}
.heatmap th:first-child{text-align:right;padding-right:12px}
.heatmap td{padding:0;text-align:center}
.heatmap td:first-child{text-align:right;padding:8px 14px;font-size:12px;color:var(--text);background:#F8FAFC;border-radius:8px;font-weight:600;min-width:160px;border:1px solid var(--border)}
.heat-cell{display:block;padding:14px 6px;border-radius:8px;font-family:'Playfair Display',serif;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.heat-link{cursor:pointer;transition:all .2s}
.heat-link:hover{transform:scale(1.05);z-index:2;position:relative}

/* Trainer table */
.trainer-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.trainer-table th{background:#F8FAFC;padding:12px 10px;text-align:right;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-family:'DM Mono',monospace;border-bottom:2px solid #E2E8F0;position:sticky;top:0;z-index:1;font-weight:700}
.trainer-table td{padding:12px 10px;border-bottom:1px solid #F1F5F9;color:var(--text)}
.trainer-table tr:hover td{background:#F8FAFC;cursor:pointer}
.tr-rank{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;text-align:center;width:50px;color:var(--text3)}
.tr-rank.top{color:#D4A574}
.tr-name{font-weight:600;color:var(--text)}
.tr-dept{font-size:10px;color:var(--text3);margin-top:2px}
.tr-pct{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;text-align:left;letter-spacing:.2px}
.tr-bar{height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle}
.tr-bar-fill{height:100%;border-radius:3px}
.tr-dips{display:inline-flex;gap:4px}
.dip-pill{font-size:9px;padding:3px 8px;border-radius:6px;color:#fff;font-weight:700;letter-spacing:.5px}

/* Axis rows */
.ax-list{display:flex;flex-direction:column;gap:10px}
.ax-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:16px;background:#F8FAFC;border:1px solid var(--border);border-radius:12px;transition:all .3s}
.ax-row:hover{border-color:var(--ac);background:#fff;box-shadow:0 4px 16px rgba(15,23,42,.06);transform:translateX(-3px)}
.ax-icon-box{font-size:22px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow)}
.ax-info{display:flex;flex-direction:column;gap:4px}
.ax-name{font-size:13px;font-weight:600;color:var(--text)}
.ax-meta{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;font-weight:500}
.ax-bar{height:10px;width:160px;background:#E2E8F0;border-radius:5px;overflow:hidden}
.ax-bar-fill{height:100%;border-radius:5px}
.ax-pct{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;color:var(--ac);min-width:80px;text-align:left;font-variant-numeric:tabular-nums;letter-spacing:.3px}

/* Items table */
.items-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.items-table th{background:#F8FAFC;padding:12px 10px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-family:'DM Mono',monospace;border-bottom:2px solid #E2E8F0;text-align:right;font-weight:700}
.items-table td{padding:12px 10px;border-bottom:1px solid #F1F5F9;color:var(--text)}
.items-table tr:hover td{background:#F8FAFC}
.it-axis-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:#fff;border:1px solid var(--border);border-radius:6px;font-size:10px;font-family:'DM Mono',monospace;font-weight:600}
.dist-bars{display:inline-flex;gap:2px;align-items:flex-end;height:36px}
.dist-bar{width:8px;border-radius:2px;transition:transform .2s;cursor:pointer}
.dist-bar:hover{transform:scaleY(1.15)}

/* Student cards */
.students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.student-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:all .3s;box-shadow:var(--shadow)}
.student-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
.student-card.warn{border-right:4px solid var(--amber)}
.student-card.danger{border-right:4px solid var(--rose)}
.st-name{font-weight:600;font-size:13px;color:var(--text)}
.st-row{display:flex;justify-content:space-between;align-items:center}
.st-pct{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--green)}
.st-pct.warn{color:var(--amber)}
.st-pct.danger{color:var(--rose)}
.st-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);font-weight:500}
.st-low{font-size:10px;color:var(--rose);padding:6px 10px;background:#FEF2F2;border-radius:6px;border:1px solid #FEE2E2;font-weight:600}

/* Trainer profile */
.profile{background:linear-gradient(135deg,#2D6A6F 0%,#3F8388 50%,#5C9EAD 100%);border:none;border-radius:22px;padding:32px;margin-bottom:20px;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;box-shadow:0 12px 36px rgba(45,106,111,.22);position:relative;overflow:hidden}
.profile::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#D4A574,#E8C9A0,#D4A574)}
.profile-avatar{width:100px;height:100px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#2D6A6F;font-family:'Playfair Display',serif;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.profile-info{display:flex;flex-direction:column;gap:4px;color:#fff}
.profile-label{font-size:10px;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:2px;font-family:'DM Mono',monospace;font-weight:600}
.profile-name{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.profile-meta{display:flex;gap:16px;font-size:12px;color:rgba(255,255,255,.95);margin-top:10px;flex-wrap:wrap}
.profile-meta span{display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;backdrop-filter:blur(8px);font-weight:500}
.profile-kpi{text-align:center}
.profile-pct{font-family:'Playfair Display',serif;font-size:60px;font-weight:900;line-height:1;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.2)}
.profile-avg{font-family:'DM Mono',monospace;font-size:12px;color:#E8C9A0;margin-top:6px;font-weight:600}

/* Findings */
.findings{display:flex;flex-direction:column;gap:10px}
.finding{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px;background:#F8FAFC;border:1px solid var(--border);border-radius:12px;border-right:4px solid var(--fc);align-items:start;transition:all .3s}
.finding:hover{background:#fff;box-shadow:0 4px 16px rgba(15,23,42,.06)}
.finding-icon{font-size:26px;line-height:1}
.finding-text{font-size:13px;color:var(--text);line-height:1.7}
.finding-text strong{color:var(--fc);font-weight:700}

/* Pages */
.page{display:none;animation:fadeIn .35s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Filter bar */
.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.filter-select{background:#fff;border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;font-weight:500;transition:all .2s}
.filter-select:hover{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.1)}

/* Print Trainer Button */
.print-trainer-btn{
  background:linear-gradient(135deg,#2D6A6F,#3F8388);
  color:#fff;border:none;padding:10px 18px;border-radius:24px;
  cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;
  box-shadow:0 4px 16px rgba(45,106,111,.28);
  display:inline-flex;gap:6px;align-items:center;transition:all .2s;
}
.print-trainer-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,106,111,.4)}
.print-mini-btn{
  background:rgba(45,106,111,.10);color:#2D6A6F;border:1px solid rgba(45,106,111,.25);
  padding:5px 10px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s;
}
.print-mini-btn:hover{background:rgba(45,106,111,.20);transform:scale(1.1)}

/* Tab Print Button */
.print-btn{position:fixed;bottom:24px;left:24px;background:linear-gradient(135deg,#2D6A6F,#3F8388);color:#fff;border:none;padding:12px 18px;border-radius:50px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(45,106,111,.28);z-index:100;display:flex;gap:6px;align-items:center}
.print-btn:hover{transform:translateY(-2px)}

/* Print mode: trainer-only — hide sidebar + other pages + global controls */
body.print-trainer-only .sidebar,
body.print-trainer-only .top-hero,
body.print-trainer-only .print-btn,
body.print-trainer-only .print-trainer-btn,

const CH=CONT.filter(r=>r.t1!=null);
const NEW=H.trainers.filter(r=>r.t2==null&&r.t3==null);
document.getElementById('pg-compare').innerHTML=
 PH('#8B6F8F','🔀','مقارنة الفصول الثلاثة','Three-Term Comparison',T.length+' فصول')

</div>
${SEC('المحاور الخمسة عبر الفصول','🧭','AXES ACROSS TERMS','<div class="chart-wrap" style="height:400px"><canvas id="c-axhist"></canvas></div>')}
${SEC('جدول المقارنة المؤسسية','🏛️','INSTITUTIONAL',
 `<table class="trainer-table"><thead><tr><th>الفصل</th><th>الرضا العام</th><th>المتوسط من 5</th><th>الشعب</th>

 </tbody></table>`)}

 `<div class="mini-legend" style="margin-bottom:14px">${CONT.length} مدرّبًا استمروا من فصل سابق على الأقل، منهم ${CONT3.length} لهم تقييم طلابي في الفصول الثلاثة جميعًا.
   أُعيد حساب أرقام الفصلين السابقين بالمنهجية نفسها — محور المدرّب وحده بالمتوسط المتوازن على مرحلتين — فالفصول الثلاثة على أساس واحد.

  <div class="chart-wrap" style="height:420px"><canvas id="c-trhist"></canvas></div>

<div class="two-col">

  `<table class="trainer-table"><thead><tr><th>المدرّب</th><th>الفصل الثاني</th><th>الصيفي 1447</th></tr></thead><tbody>
   ${H.departed.map(r=>`<tr><td class="tr-name">${esc(r.name)}</td><td class="src-pct">${pc(r.t2)}</td><td class="src-pct">${pc(r.t3)}</td></tr>`).join('')}

</div>`;

/* ── 8. جودة البيانات والمنهجية ─────────────────── */
const dup=D.sections.filter(s=>s.dup), ns=D.notes.no_survey;
document.getElementById('pg-quality').innerHTML=
 PH('#E8826E','🧾','جودة البيانات والمنهجية','Methodology & Data Quality','وثيقة مرجعية')
+SEC('معادلة درجة المدرّب','⚖️','SCORING MODEL',
 `<div class="split-bar">
   <div class="sb-stu"><b>${WS}%</b><span>تقييم الطلاب — محور المدرّب</span></div>
   <div class="sb-adm"><b>${WA}%</b><span>تقييم الإدارة — ${D.criteria.length} معايير</span></div>
   <div class="sb-tot"><b>100%</b><span>الدرجة المركَّبة</span></div>
  </div>
  <div class="note-box"><b>مكوّن الطلاب:</b> محور المدرّب وحده — البنود التي تخص أداءه هو — لا مجموع المحاور الخمسة، فلا يُحمَّل بالدعم ومكان التدريب والحقيبة والمقرر وهي خارج سيطرته.
   ويُحسب بالمتوسط المتوازن على مرحلتين: تُجمع الشعب داخل كل مقرر أولًا ثم تُجمع المقررات، فيحظى كل مقرر بوزن واحد مهما تعدد عدد شعبه أو اختلف عدد المستجيبين فيها.</div>
  <div class="note-box"><b>مكوّن الإدارة:</b> ${D.criteria.length} معايير بأوزانها المعلنة، ودرجة كل معيار من 5 تُحوَّل إلى وزنه.
   <table class="crit-table" style="margin-top:10px"><thead><tr><th>المعيار</th><th>الوزن</th></tr></thead><tbody>
   ${D.criteria.map(c=>`<tr><td>${esc(c.name)}</td><td style="text-align:center">${c.weight}</td></tr>`).join('')}
   </tbody><tfoot><tr><td>الإجمالي</td><td style="text-align:center">100</td></tr></tfoot></table></div>
  <div class="note-box"><b>نسبة الأكاديمية والدبلومات:</b> مرجّحة بعدد الاستمارات، للحفاظ على قابلية المقارنة مع الفصول السابقة، ولا تدخل فيها درجات الإدارة لأنها مؤشر مؤسسي لرضا الطلاب.</div>
  <div class="note-box"><b>نقاط البيانات:</b> عدد الاستمارات مضروبًا في ${a.n_items} بندًا. و<b>استمارات التقييم لا الطلاب:</b> الطالب الواحد يقدّم استمارة مستقلة لكل شعبة مسجَّل فيها، ومعدل الاستمارات للشعبة ${f1(a.forms_per_section)}.</div>`)
+SEC('ملاحظات على المصدر','🔎','SOURCE NOTES',
 `${ns.length?`<div class="note-box alert"><b>شعب لم يُنفَّذ عليها استبيان الطلاب (${ns.length}):</b> لها مدرّب وطلاب مسجَّلون ولا استجابة واحدة، والأرجح أن نشاط الاستبيان لم يُنشر على صفحاتها.
  <ul>${ns.map(s=>'<li>'+esc(s.course)+' ('+esc(s.acode)+') — '+esc(s.dipname)+' · مستوى '+s.level+' · شعبة '+esc(s.group)+' — '+esc(s.trainer)+' · '+s.students+' طالبًا</li>').join('')}</ul>

  <div class="note-box"><b>شعب باستمارتَي تقييم كاملتين (${dup.length}):</b> لكل منها نسختان بالعدد نفسه من المستجيبين وبمتوسطات متقاربة لا متطابقة؛ اعتُمد متوسط النسختين بدل ترجيح إحداهما.
  <ul>${dup.map(s=>'<li>'+esc(s.course)+' — '+esc(s.dipname)+' · مستوى '+s.level+' · شعبة '+esc(s.group)+'</li>').join('')}</ul></div>
  <div class="note-box info"><b>قرارات معتمدة في تقييم الإدارة:</b>
  <ul>${D.notes.decided.map(x=>'<li>'+esc(x.name)+' — '+esc(x.note)+'</li>').join('')}</ul></div>
  <div class="note-box"><b>شعب مفتوحة بلا مدرّب وبلا طلاب (${D.notes.empty_sections}):</b> موجودة على المنصة ولم تُشغَّل في هذا الفصل، فلا تدخل أي حساب.</div>
  <div class="note-box info"><b>الكادر:</b> ${D.notes.roster_size} مدرّبًا في القائمة الرسمية، منهم ${a.trainers} لهم شعب مُقيَّمة و${D.notes.admin_count} لهم تقييم إداري.</div>`);

/* ── الرسوم ─────────────────────────────────────── */
const charts={};
function mk(id,cfg){ if(charts[id])charts[id].destroy();
 const el=document.getElementById(id); if(el)charts[id]=new Chart(el,cfg); }
const FONT={family:"'DM Sans',sans-serif",size:11};
function opt(mn,mx,extra){
 return Object.assign({responsive:true,maintainAspectRatio:false,animation:false,
  plugins:{legend:{labels:{font:FONT,color:C.muted,usePointStyle:true,padding:14}}},
  scales:{x:{ticks:{font:FONT,color:C.muted},grid:{color:'rgba(226,232,240,.6)'}},
          y:{min:mn,max:mx,ticks:{font:FONT,color:C.muted},grid:{color:'rgba(226,232,240,.6)'}}}},extra||{});
}
const drawn={};
function draw(id){
 if(drawn[id])return; drawn[id]=1;
 if(id==='executive'){
  mk('c-ax',{type:'bar',data:{labels:a.axes.map(x=>x.name),datasets:[{label:'النسبة %',data:a.axes.map(x=>x.pct),
    backgroundColor:a.axes.map(x=>col(x.pct)),borderRadius:8}]},
    options:opt(80,100,{plugins:{legend:{display:false}}})});
  mk('c-dip',{type:'bar',data:{labels:D.diplomas.map(d=>d.short),datasets:[{label:'النسبة %',data:D.diplomas.map(d=>d.pct),
    backgroundColor:[C.sage,C.gold,C.plum],borderRadius:8}]},
    options:Object.assign(opt(null,null,{indexAxis:'y',plugins:{legend:{display:false}}}),
      {scales:{y:{ticks:{font:FONT,color:C.muted},grid:{display:false}},x:{min:80,max:100,ticks:{font:FONT,color:C.muted},grid:{color:'rgba(226,232,240,.6)'}}}})});
  const bins=[[0,85,'أقل من 85%'],[85,88,'85 – 88%'],[88,92,'88 – 92%'],[92,95,'92 – 95%'],[95,101,'95% فأعلى']];
  mk('c-dist',{type:'bar',data:{labels:bins.map(b=>b[2]),datasets:[{label:'عدد الشعب',
    data:bins.map(b=>D.sections.filter(s=>s.pct>=b[0]&&s.pct<b[1]).length),
    backgroundColor:[C.coral,C.gold,C.gold,C.sage,C.teal],borderRadius:8}]},
    options:opt(null,null,{plugins:{legend:{display:false}}})});
 }
 if(id==='diplomas'){
  mk('c-dipax',{type:'radar',data:{labels:D.axes,datasets:D.diplomas.map((d,i)=>({label:d.short,
    data:d.axes.map(x=>x.pct),borderColor:SER[i],backgroundColor:SER[i]+'20',borderWidth:2,pointRadius:4}))},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
     plugins:{legend:{labels:{font:FONT,usePointStyle:true,padding:14}}},
     scales:{r:{min:80,max:100,ticks:{font:{size:10}},pointLabels:{font:{family:"'DM Sans',sans-serif",size:12}}}}}});
 }
 if(id==='trainers'){
  mk('c-cmp',{type:'bar',data:{labels:ranked.map(t=>t.name),
    datasets:[{label:'تقييم الطلاب',data:ranked.map(t=>t.student_pct),backgroundColor:C.sage,borderRadius:5},
      {label:'تقييم الإدارة',data:ranked.map(t=>t.admin_pct),backgroundColor:C.gold,borderRadius:5},
      {label:'الدرجة المركَّبة',data:ranked.map(t=>t.composite),type:'line',borderColor:C.teal,borderWidth:2.5,pointRadius:4,pointBackgroundColor:C.teal}]},
    options:opt(55,100,{scales:{x:{ticks:{font:{family:"'DM Sans',sans-serif",size:10},color:C.muted,maxRotation:70,minRotation:55},grid:{display:false}},
      y:{min:55,max:100,ticks:{font:FONT,color:C.muted},grid:{color:'rgba(226,232,240,.6)'}}}})});
 }
 if(id==='axes'||id==='sections'||id==='quality'||id==='profile'){}
 if(id==='compare'){
  mk('c-hist',{type:'line',data:{labels:T.map(x=>x.label),
    datasets:[{label:'الرضا العام %',data:T.map(x=>x.overall),borderColor:C.teal,backgroundColor:'rgba(45,106,111,.14)',
      borderWidth:3.5,pointRadius:7,pointBackgroundColor:C.teal,fill:true,tension:.25}]},
    options:opt(85,95,{plugins:{legend:{display:false}}})});
  mk('c-vol',{type:'bar',data:{labels:T.map(x=>x.label),
    datasets:[{label:'استمارات التقييم',data:T.map(x=>x.forms),backgroundColor:C.sage,borderRadius:8,yAxisID:'y'},
      {label:'الشعب',data:T.map(x=>x.sections),type:'line',borderColor:C.gold,borderWidth:2.5,pointRadius:5,yAxisID:'y1',spanGaps:true}]},
    options:opt(null,null,{scales:{x:{ticks:{font:FONT,color:C.muted},grid:{display:false}},
      y:{ticks:{font:FONT,color:C.muted},grid:{color:'rgba(226,232,240,.6)'}},
      y1:{position:'right',grid:{display:false},ticks:{font:FONT,color:C.muted}}}})});
  mk('c-axhist',{type:'bar',data:{labels:D.axes,
    datasets:T.map((x,i)=>({label:x.label,borderRadius:7,backgroundColor:[C.gold,C.sage,C.teal][i],
      data:D.axes.map(ax=>{const f=(x.axes||[]).find(z=>z.name===ax);return f?f.pct:null;})}))},
    options:opt(80,95)});
  mk('c-trhist',{type:'bar',data:{labels:CH.map(r=>r.name),
    datasets:[{label:'الفصل التدريبي الثاني',data:CH.map(r=>r.t2),backgroundColor:C.gold,borderRadius:5},
      {label:'الفصل الصيفي 1447هـ',data:CH.map(r=>r.t3),backgroundColor:C.sage,borderRadius:5},
      {label:'الفصل الأول 1448هـ',data:CH.map(r=>r.t1),backgroundColor:C.teal,borderRadius:5}]},
    options:opt(80,100,{scales:{x:{ticks:{font:{family:"'DM Sans',sans-serif",size:10},color:C.muted,maxRotation:70,minRotation:55},grid:{display:false}},
      y:{min:80,max:100,ticks:{font:FONT,color:C.muted},grid:{color:'rgba(226,232,240,.6)'}}}})});
 }
}
go('executive');
